@if (isLoading()) {
<mat-progress-bar mode="indeterminate"></mat-progress-bar>
} @else {
<div class="filter">
    <div class="farmer-list-header">
        <mat-form-field appearance="outline" floatLabel="always" style="width: 300px;">
            <mat-label>Search Farmers</mat-label>
            <input matInput placeholder="Search by name or phone" [value]="searchTerm()"
                (input)="searchTerm.set($any($event.target).value)" />
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
    </div>
    <button matButton="filled" (click)="openDialog()">
        <mat-icon>add</mat-icon>
        create new Farmer
    </button>
</div>
<div class="farmers-layout">
    <app-farmers-list [farmers]="farmers()" (eventFarmer)="selectFarmer($event)"
        (eventDeleteFarmer)="openDeleteDialog($event)" />
    <div><span>Total: {{ farmers().length }}</span></div>
</div>
}
